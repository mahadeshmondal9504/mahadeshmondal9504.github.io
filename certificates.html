  <div class="lightbox" id="lightbox" role="dialog" aria-label="Certificate viewer">

  <script>
    (function () {
      var lb = document.getElementById('lightbox');
      var img = document.getElementById('lbImg');
      var cap = document.getElementById('lbCaption');
      function open(card) {
        img.src = card.querySelector('img').src;
        cap.textContent = card.getAttribute('data-caption') || '';
        lb.classList.add('open');
      }
      function close() { lb.classList.remove('open'); img.src = ''; }
      document.querySelectorAll('.cert-card').forEach(function (c) {
        c.addEventListener('click', function () { open(c); });
      });
      document.getElementById('lbClose').addEventListener('click', close);
      lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    })();
  </script>
